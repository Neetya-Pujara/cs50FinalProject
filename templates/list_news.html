{% extends "layout.html" %}

{% block main %}
    <style>
        main {
            text-align:center;
        }
    </style>
    <br>
    <h4 class="h4">Are they all okay or is there a necessity to delete some?</h4>
    <br>
    <hr>
    {% for title in titles %}
        <form action="/delete_news" method="post" style="text-align:center">
            <div class="row justify-content-center">
                <div class="col-4" style="color:red">
                    {{ title['news_title'] }}
                </div>
                <div class="col-4">
                    <input value="{{ title['news_title'] }}" name="title" type="hidden">
                    <button class="btn btn-warning" type="submit">Delete</button>
                </div>
              </div>
            <hr>
        </form>
    {% endfor %}
{% endblock %}
