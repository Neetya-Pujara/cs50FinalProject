{% extends "layout.html" %}

{% block main %}
<form action="/add_news" method="post" style="text-align:center; padding:50px">
      <div class="form-floating">
        <input type="text" class="form-control" id="floatingPassword" placeholder="Title" name="title">
        <label for="floatingPassword">Title of News Article</label>
      </div>
      <br>
      <div class="input-group">
        <span class="input-group-text">Article</span>
        <textarea class="form-control" aria-label="Article" rows="10" col="10" name="article"></textarea>
      </div>
      <br>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Send For Review</button>
      </div>
  </form>
{% endblock %}
