{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>All Pages</h1> 

    <ul>
        {% for entry in entries %}
            <li><a href="{% url 'encyclopedia:topic' title=entry %}">{{entry}}</a></li>
        {%empty%}
            <li>Sorry, no entries!</li>
        {% endfor %}
    </ul>

{% endblock %}
